#══════════════════════════════════════════════════════════════════════════════════════════════════ 
# Schema 2
#
# DEPENDENCY DECLARATIONS
# Dependencies are now grouped under [dependencies.type] headers.
# The previous "type" dependency key is still supported, but kept as legacy.
#
# MAVEN DEPENDENCIES
# Maven declarations now can skip specifying a version, defaulting to the latest release.
#
# GITHUB DEPENDENCIES
# Github declarations can now skip specifying an asset and tag, defaulting to latest release.
# The shorthand "repository = 'Example/ExampleLib'" has also been added.
#
# JAVADOC DECLARATIONS
# Configurations may now declare a javadoc target, both in folder and jar archive format.
#══════════════════════════════════════════════════════════════════════════════════════════════════ 

[project]
name = "Wisteria"
description = "Project discription."
version = "0.1.0"
natures = [ "eclipse", "maven" ]
authors = [ "Khyonie", "AnotherAuthor" ]
sourcepage = "https://github.com/Khyonie/Wisteria"

# Dependencies
#────────────────────────────────────────────────────────────────────────────────
[dependencies.archive]
file-dep = { path = "lib/Archive.jar" }

[dependencies.folder]
folder-dep = { path = "lib/", recursive = true }

[dependencies.url]
url-dep = { url = "https://libs.example.com/Example.jar" }

[dependencies.maven]
maven-dep = { group_id = "com.google.code.gson", artifact_id = "gson" }

[dependencies.github]
github-dep = { repository = "Example/ExampleLib" }

# Configurations
#────────────────────────────────────────────────────────────────────────────────
[configuration.main]
sources = [ "src/main/" ]
targets = [ "outputs/{configuration}-{version}/{project_name}.jar" ]
dependencies = [ "file-dep", "folder-dep", "url-dep", "maven-dep", "github-dep" ]
shaded = [ "file-dep" ]
includes = [ "default-config.toml" ]
entry = "com.example.wisteria.App"
java_version = 17

[configuration.main.javadoc]
output_dir = "outputs/{configuration}-{version}-javadoc/"
target = "outputs/{configuration}-{version}/{project-name}-javadoc"

[configuration.main.compiler_flags]
release_target = 17
enable_preview_features = true
javadoc_all_lints = true
source_all_lints = true
no_warnings = true
deprecation_info = true
store_parameter_names = true
source_encoding = "utf8"

[configuration.test]
inherit = "main"
sources = [ "src/test/" ]
